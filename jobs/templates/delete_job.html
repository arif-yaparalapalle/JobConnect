<!DOCTYPE html>
<html>
<head>
    <title>Delete Job - JobConnect</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fc;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        h1 {
            color: #dc2626;
        }

        p {
            color: #444;
            line-height: 1.6;
        }

        button {
            background: #dc2626;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .cancel-btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 5px;
            margin-left: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Delete Job</h1>

    <p>
        Are you sure you want to delete this job?
    </p>

    <h3>{{ job.title }}</h3>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">Yes, Delete Job</button>

        <a href="{% url 'my_posted_jobs' %}" class="cancel-btn">
            Cancel
        </a>
    </form>

</div>

</body>
</html>
