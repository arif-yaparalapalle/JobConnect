<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job | JobConnect</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            padding: 40px 15px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Post a Job</h1>
        <p>Find the right talent for your company</p>
        {% if messages %}
    {% for message in messages %}
        <div style="padding: 12px; margin-bottom: 20px; text-align: center; background: #d4edda; color: #155724; border-radius: 6px;">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}
        <form method="POST">

            {% csrf_token %}

            <label>Job Title</label>
            <input type="text" name="title" placeholder="Enter Job Title" required>

            <label>Company Name</label>
            <input type="text" name="company_name" placeholder="Enter Company Name" required>

            <label>Location</label>
            <input type="text" name="location" placeholder="Enter Job Location" required>

            <label>Job Type</label>
            <select name="job_type" required>
                <option value="">Select Job Type</option>
                <option value="Full Time">Full Time</option>
                <option value="Part Time">Part Time</option>
                <option value="Internship">Internship</option>
            </select>

            <label>Salary</label>
            <input type="text" name="salary" placeholder="Enter Salary" required>

            <label>Job Description</label>
            <textarea name="description" placeholder="Enter Job Description" required></textarea>

            <button type="submit">Post Job</button>

        </form>

    </div>

</body>
</html>
